# fly.toml app configuration file generated for laqp on 2026-03-08T17:58:40-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'laqp'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  CONFIG_DIR = '/app/config'

[[mounts]]
  source = 'laqp_data'
  destination = '/data'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
